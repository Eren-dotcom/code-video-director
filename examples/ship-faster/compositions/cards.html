<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                gap: 48px; padding: 0 160px; box-sizing: border-box; color: #fff;
                font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
        /* R12: brand color #6C5CE7 on the card border */
        .card { width: 440px; height: 300px; border-radius: 28px; background: #141a23; border: 2px solid #6c5ce7;
                display: grid; place-items: center; font-size: 56px; font-weight: 700; }
        .card span { display: block; }
      </style>

      <div id="root" data-composition-id="cards" data-width="1920" data-height="1080" data-duration="6">
        <!-- R5: exactly three; DOM order == left → right. R6–R8 verbatim labels. -->
        <div class="card" id="cards-1"><span>Speed</span></div>
        <div class="card" id="cards-2"><span>Safety</span></div>
        <div class="card" id="cards-3"><span>Scale</span></div>
      </div>

      <script>
        // LOCAL time: 0 here == absolute 6.0 (host clip data-start=6).
        // Shot list: cards at abs 6.0 / 7.0 / 8.0  →  local 0.0 / 1.0 / 2.0. SFX in index.html use the ABSOLUTE values.
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#cards-1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.0);
        tl.fromTo("#cards-2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.0);
        tl.fromTo("#cards-3", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.0);
        window.__timelines["cards"] = tl;
      </script>
    </template>
  </body>
</html>
